<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Party</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            goth: '#120d12',
            blood: '#8b0000',
            ember: '#d97706',
            mist: '#f1f5f9'
          },
          boxShadow: {
            glow: '0 0 30px rgba(139, 0, 0, 0.55)'
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(circle at top, rgba(139,0,0,0.25), transparent 35%),
        linear-gradient(135deg, #09070a 0%, #120d12 45%, #190f14 100%);
      color: #f1f5f9;
    }

    .creepster {
      font-family: 'Creepster', cursive;
      letter-spacing: 0.08em;
    }

    .glow {
      text-shadow: 0 0 18px rgba(139, 0, 0, 0.8);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-6 py-10">
  <div class="relative w-full max-w-5xl overflow-hidden rounded-3xl border border-red-900/60 bg-black/20 shadow-glow backdrop-blur-sm">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_rgba(139,0,0,0.18),transparent_52%)]"></div>

    <div class="relative grid md:grid-cols-2">
      <div class="p-8 md:p-14">
        <p class="mb-4 inline-block rounded-full border border-red-700/40 bg-red-900/20 px-4 py-2 text-xs font-bold uppercase tracking-[0.35em] text-red-300">
          Halloween Night
        </p>

        <h1 class="creepster text-5xl sm:text-6xl md:text-7xl text-red-600 glow">Spooky Scary</h1>
        <h2 class="mt-3 text-2xl font-black uppercase tracking-[0.2em] text-slate-200">Game Night</h2>

        <p class="mt-6 max-w-md text-base leading-7 text-slate-300">
          Enter the haunted lounge, unlock the download hub, and prepare for a terrifying night of games, chills, and cursed party chaos.
        </p>

        <div class="mt-8 flex flex-wrap gap-4">
          <a href="spooky_horror_party_game_hub.html" class="inline-flex items-center justify-center rounded-xl bg-red-700 px-6 py-3 text-base font-bold uppercase tracking-[0.2em] text-white transition hover:bg-red-600 hover:shadow-[0_0_24px_rgba(139,0,0,0.8)]">
            Enter the Hub
          </a>
        </div>
      </div>

      <div class="flex items-center justify-center p-8 md:p-12">
        <div class="relative flex h-72 w-72 items-center justify-center rounded-full border border-red-700/50 bg-gradient-to-br from-red-950/80 to-black/90 shadow-[0_0_30px_rgba(139,0,0,0.4)]">
          <div class="absolute h-56 w-56 rounded-full border border-red-500/30"></div>
          <div class="absolute h-44 w-44 rounded-full border border-red-500/35"></div>
          <div class="text-7xl text-red-500 drop-shadow-[0_0_20px_rgba(139,0,0,0.9)]">👻</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
